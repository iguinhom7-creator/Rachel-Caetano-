<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fotos Originais - Rachel Caetano</title>
  <style>
    body { font-family: sans-serif; background: #FAF9F6; margin: 0; padding: 20px; color: #2C2926; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .info { padding: 12px; }
    .title { font-weight: 600; font-size: 14px; }
    .sub { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Apresentação dos Serviços - Rachel Caetano</h1>
  <p>Fotos reais e originais dos atendimentos de unhas naturais:</p>
  <div class="grid">
    <div class="card">
      <img src="54f9e42f-8156-482c-a0b1-b2cf73093712.jpeg" alt="Borgonha Clássico" />
      <div class="info">
        <div class="title">Borgonha Clássico</div>
        <div class="sub">Vinho Gloss</div>
      </div>
    </div>
    <div class="card">
      <img src="729e763d-5bd5-4d01-8723-8fcf4bf7e00d.jpeg" alt="Preto Glossy Almond" />
      <div class="info">
        <div class="title">Preto Glossy Almond</div>
        <div class="sub">Black Shine</div>
      </div>
    </div>
    <div class="card">
      <img src="4ba34860-d2f7-4143-aefa-894300efc800.jpeg" alt="Glazed Pearl Nude" />
      <div class="info">
        <div class="title">Glazed Pearl Nude</div>
        <div class="sub">Perolada</div>
      </div>
    </div>
    <div class="card">
      <img src="6508e729-8f3b-49e6-b9f2-0abe324d6269.jpeg" alt="Cereja Intenso no Jeans" />
      <div class="info">
        <div class="title">Cereja Intenso no Jeans</div>
        <div class="sub">Deep Cherry</div>
      </div>
    </div>
  </div>
</body>
</html>
